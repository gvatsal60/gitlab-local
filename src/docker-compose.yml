name: gitlab-local
# Required: GITLAB_ROOT_PASSWORD (export it or put it in src/.env, which is git-ignored).
# Optional:
#   GITLAB_EXTERNAL_URL   URL clients use for the web UI (default http://localhost:8929)
#   REGISTRY_EXTERNAL_URL URL clients use for the registry (default http://localhost:5050)
#   GITLAB_BIND_ADDR      host interface to publish ports on (default 127.0.0.1)
# For HTTPS, terminate TLS in a reverse proxy in front of ports 8929/5050 and set the
# *_EXTERNAL_URL variables to the https:// hostnames. GitLab itself listens on plain HTTP.
#
# Runner bootstrap (see src/runner/):
#   1. After reconfigure, the gitlab container seeds a create_runner/manage_runner
#      personal access token into the private `runner_bootstrap` volume.
#   2. gitlab-runner-init creates the instance runner via the REST API and writes
#      config.toml with `gitlab-runner register`. No Docker socket is needed for this.
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    hostname: gitlab.local
    restart: unless-stopped
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost:8929}'
        nginx['listen_port'] = 8929
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        prometheus_monitoring['enable'] = false
        registry_external_url '${REGISTRY_EXTERNAL_URL:-http://localhost:5050}'
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false
      GITLAB_ROOT_PASSWORD: "${GITLAB_ROOT_PASSWORD:?Set GITLAB_ROOT_PASSWORD (see src/docker-compose.yml header)}"
      GITLAB_POST_RECONFIGURE_SCRIPT: "sh /opt/runner/post-reconfigure.sh"
    ports:
      - "${GITLAB_BIND_ADDR:-127.0.0.1}:8929:8929"
      - "${GITLAB_BIND_ADDR:-127.0.0.1}:2222:22"
      - "${GITLAB_BIND_ADDR:-127.0.0.1}:5050:5050"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      - runner_bootstrap:/bootstrap
      - ./runner:/opt/runner:ro
    networks:
      gitlab-net:
        aliases:
          - gitlab
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "/opt/gitlab/embedded/bin/curl", "-fsS", "http://localhost:8929/-/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
  gitlab-runner-init:
    image: gitlab/gitlab-runner:latest
    depends_on:
      gitlab:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/runner/runner-init.sh"]
    environment:
      GITLAB_URL: http://gitlab:8929
      RUNNER_NETWORK: gitlab-local-net
    volumes:
      - runner_config:/etc/gitlab-runner
      - runner_bootstrap:/bootstrap:ro
      - ./runner:/opt/runner:ro
    networks:
      - gitlab-net
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    restart: unless-stopped
    depends_on:
      gitlab-runner-init:
        condition: service_completed_successfully
    volumes:
      - runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitlab-net
    healthcheck:
      test: ["CMD", "gitlab-runner", "verify"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  # Fixed name so the runner's job containers can join it (RUNNER_NETWORK above).
  gitlab-net:
    name: gitlab-local-net
volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  runner_config:
  runner_bootstrap:
